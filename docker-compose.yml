services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-paperclip}
      POSTGRES_USER: ${DB_USER:-paperclip}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-paperclip_secret_pass}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.20'
          memory: 256M

  paperclip:
    image: ${DOCKER_HUB_USERNAME}/paperclip-custom-alfastage:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Configurações de Rede
      - HOST=0.0.0.0
      - PORT=3100
      # Modo Authenticated + Public
      - PAPERCLIP_DEPLOYMENT_MODE=authenticated
      - PAPERCLIP_DEPLOYMENT_EXPOSURE=public
      - PAPERCLIP_AUTH_PUBLIC_BASE_URL=https://${DOMAIN}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - DATABASE_URL=postgresql://${DB_USER:-paperclip}:${DB_PASSWORD:-paperclip_secret_pass}@postgres:5432/${DB_NAME:-paperclip}
      # Chaves e Segredos de IA
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    volumes:
      - paperclip-data:/root/.paperclip
      - hermes-skills:/root/.hermes
      - opencode-config:/root/.opencode
      - gemini-cli-config:/root/.gemini
      - general-config:/root/.config
      - codex-config:/root/.codex
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2.5G
        reservations:
          cpus: '0.25'
          memory: 512M

volumes:
  pgdata:
  paperclip-data:
  hermes-skills:
  opencode-config:
  gemini-cli-config:
  general-config:
  codex-config:




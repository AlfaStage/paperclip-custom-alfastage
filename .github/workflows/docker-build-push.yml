name: Build and Push Custom Paperclip Image

on:
  push:
    branches:
      - main
      - master
  schedule:
    # Executa todo domingo à meia-noite para buscar atualizações upstream do Paperclip
    - cron: '0 0 * * 0'
  workflow_dispatch: # Permite disparo manual

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout custom repository
        uses: actions/checkout@v4

      - name: Check upstream Paperclip updates
        id: check_upstream
        run: |
          UPSTREAM_COMMIT=$(curl -s https://api.github.com/repos/paperclipai/paperclip/commits/master | jq -r '.sha')
          echo "upstream_sha=$UPSTREAM_COMMIT" >> $GITHUB_OUTPUT
          
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Clone Upstream Paperclip
        run: |
          git clone https://github.com/paperclipai/paperclip.git upstream-paperclip
          cd upstream-paperclip
          git checkout master

      - name: Inject Custom Dockerfile
        run: |
          cp Dockerfile upstream-paperclip/Dockerfile

      - name: Build and Push custom Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./upstream-paperclip
          file: ./upstream-paperclip/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/paperclip-custom-alfastage:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/paperclip-custom-alfastage:${{ steps.check_upstream.outputs.upstream_sha }}
